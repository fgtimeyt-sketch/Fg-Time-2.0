name: Build and Release FG TIME Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FG TIME APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure environment file exists
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Verify google-services.json presence
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p app
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret..."
              echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            elif [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
              echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON secret..."
              printf "%s\n" "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
            fi
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing!"
            echo "------------------------------------------------------------------"
            echo "Firebase Configuration is required for FG TIME."
            echo "Application ID: com.aistudio.fgtime.vksqza"
            echo "Firebase Project: gen-lang-client-0188920817"
            echo ""
            echo "Steps to configure:"
            echo "Option 1: Commit and push 'app/google-services.json' (already generated in AI Studio) to your GitHub repo."
            echo "Option 2: Add the contents of google-services.json as a GitHub repository secret named GOOGLE_SERVICES_JSON (or base64 encoded as GOOGLE_SERVICES_JSON_BASE64)."
            echo ""
            echo "If you need to re-download from Firebase Console:"
            echo "1. Go to Firebase Console: https://console.firebase.google.com/project/gen-lang-client-0188920817/settings/general"
            echo "2. Under 'Your apps', locate the Android app with package name 'com.aistudio.fgtime.vksqza'."
            echo "3. Download 'google-services.json'."
            echo "4. Place it in the 'app/' directory of this repository."
            echo "------------------------------------------------------------------"
            exit 1
          fi

          if ! grep -q "com.aistudio.fgtime.vksqza" app/google-services.json; then
            echo "::error::app/google-services.json does not match required package name com.aistudio.fgtime.vksqza!"
            exit 1
          fi
          echo "Verified: app/google-services.json is valid for package com.aistudio.fgtime.vksqza."

      - name: Decode Debug Keystore if needed
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FG-TIME-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: FG TIME ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
