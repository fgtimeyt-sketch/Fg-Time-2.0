name: Build and Release FG TIME Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FG TIME APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Ensure environment file exists
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env || touch .env
          fi

      - name: Verify google-services.json presence
        env:
          GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          mkdir -p app
          if [ ! -f app/google-services.json ]; then
            if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
              echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret..."
              echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json
            elif [ -n "$GOOGLE_SERVICES_JSON_SECRET" ]; then
              echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON secret..."
              printf "%s\n" "$GOOGLE_SERVICES_JSON_SECRET" > app/google-services.json
            elif [ -f app/google-services.json.base64 ]; then
              echo "Restoring app/google-services.json from app/google-services.json.base64..."
              base64 -d app/google-services.json.base64 > app/google-services.json
            else
              echo "Restoring app/google-services.json from authentic project configuration..."
              cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "455868092391",
    "project_id": "gen-lang-client-0188920817",
    "storage_bucket": "gen-lang-client-0188920817.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:455868092391:android:dcd190d84dc93436a1b742",
        "android_client_info": {
          "package_name": "com.aistudio.fgtime.vksqza"
        }
      },
      "oauth_client": [
        {
          "client_id": "455868092391-eg5o93snhhq30q6059rngenf834ic0t8.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.aistudio.fgtime.vksqza",
            "certificate_hash": "7f9ec7a052d2f7a6b126d18700bc6af801f54e9a"
          }
        },
        {
          "client_id": "455868092391-sinmt153oaqt0jp28fdv98lslh9ru0qg.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyCGaaIQ5zP964WPLRxIjbl_axwZOFJZzm0"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "455868092391-sinmt153oaqt0jp28fdv98lslh9ru0qg.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
            fi
          fi

          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing!"
            exit 1
          fi

          if ! grep -q "com.aistudio.fgtime.vksqza" app/google-services.json; then
            echo "::error::app/google-services.json does not match required package name com.aistudio.fgtime.vksqza!"
            exit 1
          fi
          echo "Verified: app/google-services.json is valid for package com.aistudio.fgtime.vksqza."

      - name: Decode Debug Keystore if needed
        env:
          DEBUG_KEYSTORE_SECRET: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -n "$DEBUG_KEYSTORE_SECRET" ]; then
              echo "Restoring debug.keystore from DEBUG_KEYSTORE_BASE64 secret..."
              echo "$DEBUG_KEYSTORE_SECRET" | base64 -d > debug.keystore
            elif [ -f debug.keystore.base64 ]; then
              echo "Restoring debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating standard debug keystore..."
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle testDebugUnitTest

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FG-TIME-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: FG TIME ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
